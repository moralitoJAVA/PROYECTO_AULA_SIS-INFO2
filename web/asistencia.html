<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Puntualidad y Sanción</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
</head>
<body>
<div class="pagina">
<header class="cabecera">
    <div>
        <h1>Puntualidad y Sanción</h1>
        <p class="materia">Sistemas de Información 2 - Control de Fruta</p>
    </div>
    <nav class="navegacion" aria-label="Secciones">
        <a href="/">Inicio</a>
        <a href="/asistencia.html" aria-current="page">Puntualidad</a>
        
        
    </nav>
</header>
    <main>
      <div id="alerta" class="advertencia" role="alert" hidden>
        <svg class="icono" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3l8 14H2z"/><path d="M10 8v4M10 14.5v.5"/></svg><p id="alerta-texto"></p>
      </div>
      
      <!-- SECCIÓN DE EVALUACIÓN DE INGRESO Y FRUTA (HU 1) -->
      <section class="tarjeta" aria-labelledby="titulo-marcar">
        <h2 id="titulo-marcar">Control de Ingreso y Sanción</h2>
        <p class="ayuda">Clases: Martes, Miércoles y Viernes de 06:45 a 08:14. Límite sin sanción: 07:00 a.m.</p>
        <div class="campos" style="margin-top: 15px;">
          <div class="campo-completo">
            <label for="fecha-ingreso">Fecha y Hora de Ingreso</label>
            <input id="fecha-ingreso" type="datetime-local">
          </div>
        </div>
        <button id="marcar" class="boton primario grande" style="margin-top: 20px;" onclick="evaluarSancionFruta()">Evaluar mi ingreso</button>
        <div id="resultado-sancion" style="margin-top: 20px; font-size: 1.1em; font-weight: bold;"></div>
      </section>

      <!-- HISTORIAL DE EVALUACIONES -->
      <section class="tarjeta" aria-labelledby="titulo-historial">
        <h2 id="titulo-historial">Historial de Puntualidad</h2>
        <div class="tabla-caja">
          <table class="tabla">
            <thead><tr><th>Fecha y Hora</th><th>Estado / Sanción</th></tr></thead>
            <tbody id="historial"></tbody>
          </table>
          <div id="historial-vacio" class="vacio">Todavía no registraste ningún ingreso.</div>
        </div>
      </section>
    </main>
  </div>
  <div id="mensaje" class="mensaje" role="status" hidden></div>
  <script src="/js/comun.js"></script>
  <script>
    function evaluarSancionFruta() {
        const inputFecha = document.getElementById('fecha-ingreso').value;
        
        if (!inputFecha) {
            alert("Por favor selecciona una fecha y hora");
            return;
        }

        // Enviamos la fecha directamente con segundos para que Flask la lea de forma exacta sin conversiones UTC
        const fechaEnvio = inputFecha.length === 16 ? inputFecha + ":00" : inputFecha;

        fetch('/api/asistencia/evaluar-sancion', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ fecha: fechaEnvio })
        })
        .then(response => response.json())
        .then(data => {
            const contenedor = document.getElementById('resultado-sancion');
            const tbody = document.getElementById('historial');
            document.getElementById('historial-vacio').style.display = 'none';

            let textoEstado = "";
            if (data.estado === "Debe fruta") {
                textoEstado = `⚠️ <span style="color: #dc2626;">Debe fruta</span> (Ingreso: ${data.hora_ingreso}. Penalización: llevar una fruta la siguiente clase).`;
            } else if (data.estado === "Puntual") {
                textoEstado = `✅ <span style="color: #16a34a;">Puntual</span> (Ingreso: ${data.hora_ingreso}. ¡Sin sanción!).`;
            } else {
                textoEstado = `ℹ️ ${data.estado} (Fuera de horario de clases o día no válido).`;
            }

            contenedor.innerHTML = textoEstado;

            // Agregar al historial
            const fila = document.createElement('tr');
            fila.innerHTML = `<td>${data.hora_ingreso}</td><td>${data.estado}</td>`;
            tbody.appendChild(fila);
        })
        .catch(error => {
            console.error('Error al evaluar la sanción:', error);
        });
    }
  </script>
</body>
</html>
