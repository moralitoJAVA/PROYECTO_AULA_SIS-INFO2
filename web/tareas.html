<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis tareas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/tareas.css">
</head>
<body>
  <div class="pagina">
    <header class="cabecera">
      <div>
        <h1>Mis tareas</h1>
        <p class="materia">Sistemas de Información 2</p>
      </div>
      <nav class="navegacion" aria-label="Secciones">
        <a href="/">Inicio</a>
        <a href="/asistencia.html">Asistencia</a>
        <a href="/tareas.html" aria-current="page">Tareas</a>
      </nav>
    </header>

    <main>
      <div id="advertencia" class="advertencia" role="alert" hidden></div>

      <div class="filtros" id="filtros" role="group" aria-label="Filtrar por estado">
        <button class="filtro" data-estado="" aria-pressed="true">Todas <span class="cuenta" data-cuenta="">0</span></button>
        <button class="filtro" data-estado="Pendiente" aria-pressed="false">Pendientes <span class="cuenta" data-cuenta="Pendiente">0</span></button>
        <button class="filtro" data-estado="Entregada" aria-pressed="false">Entregadas <span class="cuenta" data-cuenta="Entregada">0</span></button>
        <button class="filtro" data-estado="Calificada" aria-pressed="false">Calificadas <span class="cuenta" data-cuenta="Calificada">0</span></button>
      </div>

      <ul id="lista" class="lista"></ul>
      <div id="vacio" class="vacio" hidden></div>
    </main>
  </div>

  <div id="fondo" class="fondo" hidden></div>
  <aside id="detalle" class="panel" role="dialog" aria-modal="true" aria-labelledby="detalle-titulo" aria-hidden="true">
    <div id="detalle-contenido"></div>
  </aside>
  <div id="mensaje" class="mensaje" role="status" hidden></div>

  <script src="/js/comun.js"></script>
  <script src="/js/panel_tareas.js"></script>
</body>
</html>
