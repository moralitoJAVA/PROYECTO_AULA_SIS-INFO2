<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enviar tarea al docente</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
</head>
<body>
  <div class="pagina">
    <header class="cabecera">
      <div><h1>Enviar tarea al docente</h1><p class="materia">Sistemas de Información 2</p></div>
      <nav class="navegacion" aria-label="Secciones">
        <a href="/">Inicio</a><a href="/envio_tareas.html" aria-current="page">Enviar tarea</a>
      </nav>
    </header>
    <main>
      <form id="formulario-docente" class="tarjeta">
        <h2>Docente de la materia</h2>
        <p class="ayuda">El docente registra aquí su correo institucional para la materia.</p>
        <div class="campos">
          <div><label for="materia-docente">Materia</label><input id="materia-docente" required value="Sistemas 2"></div>
          <div><label for="correo-docente">Correo del docente</label><input id="correo-docente" type="email" required placeholder="docente.si2@umss.edu.bo"></div>
        </div>
        <div class="acciones"><button type="submit" class="boton secundario">Guardar correo del docente</button></div>
      </form>

      <form id="formulario" class="tarjeta">
        <h2>Datos del envío</h2>
        <div class="campos">
          <div><label for="materia">Materia</label><input id="materia" required value="Sistemas 2"></div>
          <div class="campo-completo"><label>Correo del docente</label><output id="docente" class="ayuda">Escribe la materia para ver el correo…</output></div>
          <div class="campo-completo"><label for="tarea">Tarea</label><input id="tarea" required placeholder="Ej.: Tarea 1: diagrama de clases"></div>
          <div><label for="estudiante">Tu nombre</label><input id="estudiante" required placeholder="Ej.: Ana Pérez"></div>
          <div><label for="correo_estudiante">Tu correo o código</label><input id="correo_estudiante" required placeholder="ana.perez@est.umss.edu.bo"></div>
          <div><label for="fecha_limite">Fecha límite</label><input id="fecha_limite" type="datetime-local" required></div>
          <div class="campo-completo"><label for="adjuntos">Archivos a enviar</label><input id="adjuntos" type="file" multiple required></div>
        </div>
        <p id="estado" class="ayuda">Estado de la tarea: <strong>Pendiente</strong></p>
        <div class="acciones"><button type="submit" class="boton">Enviar tarea</button></div>
      </form>
      <div id="mensaje" class="mensaje" hidden role="status"></div>
    </main>
  </div>
  <script src="/js/comun.js"></script>
  <script src="/js/vista_envio_tareas.js"></script>
</body>
</html>
