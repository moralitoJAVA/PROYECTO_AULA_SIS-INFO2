<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nota final</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
</head>
<body>
  <div class="pagina">
    <header class="cabecera">
      <div>
        <h1>Nota final</h1>
        <p class="materia">Sistemas de Información 2</p>
      </div>
      <nav class="navegacion" aria-label="Secciones">
        <a href="/">Inicio</a>
        <a href="/asistencia.html">Asistencia</a>
        <a href="/tareas.html">Tareas</a>
        <a href="/registro_tarea.html">Registrar tarea</a>
        <a href="/nota_final.html" aria-current="page">Nota final</a>
      </nav>
    </header>
    <main>
      <section class="tarjeta" aria-labelledby="titulo-nota">
        <h2 id="titulo-nota">Mi desglose</h2>
        <div class="metrica ok">
          <span class="metrica-cifra" id="nota-final">pendiente</span>
          <span class="metrica-nota" id="parcial"></span>
        </div>
        <div class="tabla-caja">
          <table class="tabla">
            <thead><tr><th>Componente</th><th class="num">Peso</th><th class="num">Nota</th><th class="num">Aporte</th><th class="num">Penalización</th></tr></thead>
            <tbody id="desglose"></tbody>
          </table>
        </div>
      </section>
      <section class="tarjeta" aria-labelledby="titulo-pesos">
        <h2 id="titulo-pesos">Pesos de cada componente (%)</h2>
        <p class="ayuda">Deben sumar 100. Al guardar, el desglose se recalcula.</p>
        <div class="campos">
          <div><label for="peso-asistencia">Asistencia</label><input id="peso-asistencia" type="number" step="0.1"></div>
          <div><label for="peso-tareas">Tareas</label><input id="peso-tareas" type="number" step="0.1"></div>
          <div><label for="peso-examenes">Exámenes</label><input id="peso-examenes" type="number" step="0.1"></div>
          <div><label for="peso-proyecto">Proyecto en equipo</label><input id="peso-proyecto" type="number" step="0.1"></div>
        </div>
        <button id="guardar" class="boton primario grande">Guardar pesos</button>
      </section>
    </main>
  </div>
  <div id="mensaje" class="mensaje" role="status" hidden></div>
  <script src="/js/comun.js"></script>
  <script src="/js/vista_nota_final.js"></script>
</body>
</html>
