<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registrar tarea</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
</head>
<body>
  <div class="pagina">
    <header class="cabecera">
      <div><h1>Registrar tarea</h1><p class="materia">Sistemas de Información 2</p></div>
      <nav class="navegacion" aria-label="Secciones">
        <a href="/">Inicio</a><a href="/asistencia.html">Asistencia</a><a href="/tareas.html">Tareas</a><a href="/registro_tarea.html" aria-current="page">Registrar tarea</a><a href="/nota_final.html">Nota final</a>
      </nav>
    </header>
    <main>
      <form id="formulario" class="tarjeta">
        <h2>Datos de la tarea</h2>
        <p class="ayuda">La fecha límite debe ser martes, miércoles o viernes a las 06:45.</p>
        <div class="campos">
          <div class="campo-completo"><label for="titulo">Título</label><input id="titulo" required maxlength="120" placeholder="Ej.: Modelo de datos"></div>
          <div class="campo-completo"><label for="instrucciones">Instrucciones</label><textarea id="instrucciones" rows="4" required placeholder="Describe lo que debe entregar el estudiante"></textarea></div>
          <div><label for="fecha_limite">Fecha límite</label><input id="fecha_limite" type="datetime-local" required></div>
          <div><label for="tipo">Tipo de tarea</label><select id="tipo"><option value="Individual">Individual</option><option value="Grupal">Grupal</option></select></div>
          <div id="campo-tamano" hidden><label for="tamano_equipo">Integrantes por equipo</label><input id="tamano_equipo" type="number" min="2" value="2"></div>
          <div class="campo-completo"><label for="ruta_adjunto">Guía o recurso adjunto</label><input id="ruta_adjunto" required placeholder="Ej.: /guias/tarea-01.pdf"></div>
        </div>

        <h2>Rúbrica</h2>
        <p class="ayuda">Agrega los criterios y su puntaje. Debes incluir al menos uno.</p>
        <ul id="criterios" class="criterios"></ul>
        <div class="acciones-fila">
          <button id="agregar-criterio" type="button" class="boton secundario">Agregar criterio</button>
          <p class="total">Total: <strong id="total">0</strong> puntos</p>
        </div>
        <button class="boton primario grande" type="submit">Registrar tarea</button>
      </form>
    </main>
  </div>
  <div id="mensaje" class="mensaje" role="status" hidden></div>
  <script src="/js/comun.js"></script>
  <script src="/js/registro_tarea.js"></script>
</body>
</html>
